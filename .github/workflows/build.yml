name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.LOUKAI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LOUKAI_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secret; the release APK will be debug-signed."
          fi

      - name: Build release APK
        env:
          LOUKAI_KEYSTORE_PASSWORD: ${{ secrets.LOUKAI_KEYSTORE_PASSWORD }}
          LOUKAI_KEY_ALIAS: ${{ secrets.LOUKAI_KEY_ALIAS }}
          LOUKAI_KEY_PASSWORD: ${{ secrets.LOUKAI_KEY_PASSWORD }}
          LOUKAI_VERSION_CODE: ${{ github.run_number }}
          LOUKAI_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.0-{0}', github.run_number) }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/loukai-android-${LOUKAI_NAME}.apk"
        env:
          LOUKAI_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: loukai-android-apk
          path: out/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/*.apk --title "${{ github.ref_name }}" --generate-notes
